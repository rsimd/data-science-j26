[project]
name = "data-science"
version = "0.1.0"
requires-python = ">=3.12.2"
dependencies = [
    "jupyter-book>=2.1.7",
    "matplotlib>=3.11.2",
    "matplotlib-fontja>=1.1.0",
    "numpy>=2.5.3",
    "pymc>=6.3.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
]
